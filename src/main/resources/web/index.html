<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b090e">
<title>STARK NETWORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b090e;--s1:#15111a;--s2:#1c1722;--s3:#261f2e;
  --line:rgba(226,203,150,.13);--line2:rgba(226,203,150,.25);
  --text:#f1ebdf;--mute:#a49cb0;--faint:#736b7e;
  --gold:#d9b66e;--gold2:#f2d594;--goldink:#2a1d05;
  --red:#e8645c;--amber:#e8a540;--ok:#52cc9c;--violet:#a78bfa;--blue:#5865f2;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Geeza Pro","Segoe UI",Tahoma,serif;
  --sans:system-ui,-apple-system,"Segoe UI","Geeza Pro",Tahoma,"Helvetica Neue",Arial,sans-serif;
  --to:to right;
}
html[dir=rtl]{--to:to left}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--text);
  background:
    radial-gradient(900px 540px at 88% -8%,rgba(107,79,168,.24),transparent 62%),
    radial-gradient(720px 500px at 0% 108%,rgba(217,182,110,.10),transparent 62%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
svg.ic{display:inline-block;flex:none;vertical-align:middle}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.wm{font-family:var(--display);letter-spacing:.28em;font-weight:600;line-height:1.05}

/* ───── buttons & fields ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,filter .15s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--goldink);border-color:transparent}
.btn.gold:hover{filter:brightness(1.07)}
.btn.red{background:rgba(232,100,92,.13);border-color:rgba(232,100,92,.45);color:#ffb9b3}.btn.red:hover{background:rgba(232,100,92,.24)}
.btn.amber{background:rgba(232,165,64,.12);border-color:rgba(232,165,64,.45);color:#ffd79a}.btn.amber:hover{background:rgba(232,165,64,.22)}
.btn.ok{background:rgba(82,204,156,.12);border-color:rgba(82,204,156,.42);color:#a9efd2}.btn.ok:hover{background:rgba(82,204,156,.22)}
.btn.s-red{background:#d9544c;border-color:transparent;color:#fff}.btn.s-red:hover{background:#e5645c}
.btn.s-amber{background:#e8a540;border-color:transparent;color:#2b1a00}.btn.s-amber:hover{background:#f0b255}
.btn.s-ok{background:#43bf8f;border-color:transparent;color:#06231a}.btn.s-ok:hover{background:#56cd9f}
.btn.dc{background:var(--blue);border-color:transparent;color:#fff;padding:13px 20px;border-radius:14px;width:100%}.btn.dc:hover{background:#6b77f5}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mute);cursor:pointer}
.icon-btn:hover{color:var(--text);background:rgba(255,255,255,.09)}
.input{width:100%;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line2);color:var(--text);outline:none}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,182,110,.18)}
.field{position:relative;flex:1;min-width:200px}
.field>svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.field .input{padding-inline-start:42px}
label{display:block;font-size:13px;color:var(--mute);margin:18px 0 7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:12.5px;cursor:pointer}
.chips button:hover{border-color:var(--gold);color:var(--gold2)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid var(--line)}
.seg button{padding:7px 14px;border-radius:9px;border:0;background:none;color:var(--mute);font-weight:600;font-size:13.5px;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:rgba(217,182,110,.18);color:var(--gold2)}
.lang{direction:ltr}

/* ───── surfaces ───── */
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:15px;font-weight:600}
.card h2 svg{color:var(--gold)}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.tag{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag.red{--c:var(--red)}.tag.ok{--c:var(--ok)}.tag.dark{--c:var(--violet)}.tag.amber{--c:var(--amber)}.tag.blue{--c:#8f98ff}
.k-ban{--c:var(--red)}.k-blacklist{--c:var(--violet)}.k-unban,.k-unblacklist{--c:var(--ok)}.k-kick{--c:var(--amber)}
img.head{display:block;border-radius:9px;image-rendering:pixelated;background:#000;flex:none}
.ph{display:grid;place-items:center;border-radius:9px;background:var(--s3);color:var(--faint);flex:none}
.av{border-radius:50%;object-fit:cover;background:var(--s3);flex:none;width:38px;height:38px}

/* ───── shell ───── */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:26px 16px 18px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 45%),var(--s1);border-inline-end:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding:0 8px 26px;color:var(--gold)}
.brand .wm{font-size:21px;color:var(--text)}
.brand .wm.b2{font-size:11px;color:var(--gold);letter-spacing:.5em;margin-top:6px;font-weight:500}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid transparent;background:none;color:var(--mute);font-weight:500;cursor:pointer;text-align:start}
.nav:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav.on{color:var(--text);border-color:var(--line);background:linear-gradient(var(--to),rgba(217,182,110,.17),rgba(217,182,110,.03))}
.nav.on svg{color:var(--gold2)}
.spacer{flex:1}
aside .lang{align-self:stretch;display:flex}aside .lang button{flex:1;padding-inline:6px}
.me{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.me .who{min-width:0;flex:1}
.me b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--gold);font-size:12px}
main{padding:34px 40px 60px;max-width:1240px;width:100%;margin-inline:auto}
h1{margin:0 0 6px;font-family:var(--display);font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.15;letter-spacing:-.01em}
html[lang=ar] h1{letter-spacing:0}
.sub{color:var(--mute);margin:0 0 24px;max-width:62ch}
.head-row{margin-bottom:22px}
.mtop{display:none;align-items:center;gap:10px;margin-bottom:18px}
.mtop .brand{padding:0;flex:1;gap:8px}.mtop .brand .wm{font-size:15px}

/* ───── home ───── */
.home{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.home .wide{grid-column:1/-1}
.home .span2{grid-column:span 2}
.home>.card{margin:0}
.home .mini{min-height:112px}
.lab{color:var(--mute);font-size:13.5px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 34px;align-items:center;gap:12px;font-size:13.5px}
.bar .bn{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(var(--to),var(--gold),var(--gold2))}
.bar .bc{text-align:end;font-weight:600}
.mini{display:flex;align-items:center;gap:16px}
.mini .ico{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.mini .n{font-family:var(--display);font-size:42px;font-weight:500;line-height:1}
.mini .lab{margin-top:6px}

/* ───── activity ───── */
.log{display:flex;flex-direction:column;max-height:520px;overflow:auto;margin-inline:-6px;padding-inline:6px}
.lg{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid rgba(226,203,150,.07);font-size:14px}
.lg:last-child{border-bottom:0}
.lgav{position:relative;flex:none}
.lgav .b{position:absolute;inset-inline-end:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#150f05;border:2px solid var(--s2)}
.lg small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.lg b{font-weight:600}.lg .pl{color:var(--gold2)}

/* ───── players ───── */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;text-align:start;color:inherit}
.tile:hover{border-color:var(--line2);background:rgba(217,182,110,.07)}
.tile .nm{min-width:0;flex:1}.tile b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{color:var(--faint);font-size:12px}
.tile svg{color:var(--gold)}
.srv{margin-top:20px}.srv .row{margin-bottom:10px}.srv .nm{font-weight:600}
.pgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:16px;align-items:start}
.pgrid>*{min-width:0}.pgrid .card{margin-bottom:0}
.pside .tiles{grid-template-columns:1fr}
.tag.num{direction:inherit;unicode-bidi:normal}
.stack{display:flex;flex-direction:column;gap:16px}
.pside{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.dossier{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:center}
.bust{height:200px;border-radius:18px;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:radial-gradient(130px 150px at 50% 40%,rgba(242,213,148,.30),transparent 72%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.28))}
.bust img{height:178px;image-rendering:pixelated;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.pname{margin:0 0 12px;font-family:var(--display);font-weight:500;font-size:clamp(30px,4vw,46px);line-height:1.08;word-break:break-all;letter-spacing:0}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sect{padding:18px 20px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid var(--line);border-inline-start:3px solid var(--c,var(--line2))}
.sect h4{margin:0 0 12px;font-size:14px;font-weight:600}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 14px;font-size:14px;align-items:center}
.kv>div:nth-child(odd){color:var(--mute)}
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(var(--to),var(--gold),var(--gold2))}
.prog.perm i{background:var(--red)}

/* ───── tables ───── */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--faint);font-size:12.5px;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid rgba(226,203,150,.07);text-align:start;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.035)}
.who2{display:flex;align-items:center;gap:10px;font-weight:600}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

/* ───── modal, toast ───── */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,4,9,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal{width:100%;max-width:480px;padding:26px;border-radius:22px;background:var(--s2);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.65);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mh h3{margin:0;font-size:19px;font-weight:600}.mh .mp{color:var(--gold2);font-weight:600}
.mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.md{color:var(--mute);font-size:14px;margin:4px 0 0}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.toast{position:fixed;bottom:26px;z-index:30;max-width:92%;display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--s3);border:1px solid var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.5);font-weight:600}
.toast.err{color:#ffb9b3}.toast.ok{color:#b4f0d8}

/* ───── login ───── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative}
.login .lang{position:absolute;top:20px;inset-inline-end:20px}
.lbox{width:100%;max-width:430px;text-align:center}
.lbox .gem{color:var(--gold);margin-bottom:14px}
.lbox .wm.t1{font-size:clamp(40px,10vw,54px);color:var(--text)}
.lbox .wm.t2{font-size:13px;color:var(--gold);letter-spacing:.7em;font-weight:500;margin:10px 0 34px;padding-inline-start:.7em}
.lbox .card{padding:30px 28px;margin:0;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border-color:var(--line2)}
.lbox h2{display:block;font-family:var(--display);font-weight:500;font-size:27px;margin:0 0 10px}
.lbox p{color:var(--mute);margin:0 0 24px;line-height:1.8}.lbox p b{color:var(--gold2);font-weight:600}
.lbox .note{display:inline-flex;align-items:center;gap:8px;margin-top:20px;color:var(--faint);font-size:13px}
.err-box{display:flex;gap:10px;align-items:flex-start;text-align:start;background:rgba(232,100,92,.1);border:1px solid rgba(232,100,92,.4);color:#ffb9b3;padding:12px 14px;border-radius:12px;margin-bottom:20px;font-size:14px}
.err-box svg{margin-top:2px}

.boot{animation:veil .6s ease both}
@keyframes veil{from{opacity:0}to{opacity:1}}

/* ───── mobile ───── */

/* ───── elegant pass ───── */
:root{--bg:#09080c;--s1:#100e14;--s2:#17141c;--s3:#211d28;--line:rgba(226,203,150,.09);--line2:rgba(226,203,150,.2);
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI","Geeza Pro",Tahoma,sans-serif;--display:"IBM Plex Sans Arabic",system-ui,"Segoe UI","Geeza Pro",Tahoma,sans-serif}
body{font-size:15px;line-height:1.7;background:radial-gradient(800px 420px at 92% -10%,rgba(107,79,168,.14),transparent 65%),var(--bg)}
h1{font-weight:300;font-size:clamp(30px,3.4vw,42px);letter-spacing:0;margin-bottom:8px}
.sub{color:var(--faint);font-size:14.5px;margin-bottom:34px}
main{padding:46px 52px 80px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:26px 28px}
.card h2{font-size:14px;font-weight:500;color:var(--mute);margin-bottom:20px}
.card h2 svg{color:var(--gold);opacity:.85}
aside{background:var(--s1);padding:34px 18px 20px;gap:2px}
.brand{padding:0 12px 38px}
.brand .wm{font-family:var(--sans);font-weight:500;font-size:19px;letter-spacing:.32em}
.nav{padding:12px 14px;border:0;border-radius:10px;font-weight:400;position:relative}
.nav:hover{background:rgba(255,255,255,.03)}
.nav.on{background:rgba(217,182,110,.07);color:var(--gold2)}
.nav.on::before{content:"";position:absolute;inset-inline-start:-18px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
html[dir=rtl] .nav.on::before{border-radius:3px 0 0 3px}
.me{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 6px 0;margin-top:14px}
.btn{border-radius:10px;font-weight:500;padding:10px 18px}
.btn.gold{background:var(--gold);box-shadow:none}
.input{background:rgba(255,255,255,.02);border-radius:10px;padding:12px 14px}
.field>svg{opacity:.7}
.seg{background:none;border-radius:10px}
.seg button[aria-pressed=true]{background:rgba(217,182,110,.12)}
.tag{font-weight:500;padding:2px 11px;background:none;border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.home{gap:18px}
.mini{display:block;position:relative;padding:34px 28px 26px}
.mini .ico{position:absolute;top:22px;inset-inline-end:24px;width:auto;height:auto;border:0;background:none;color:var(--c);opacity:.8}
.mini .n{font-size:54px;font-weight:200;line-height:1}
.mini .lab{margin:8px 0 0;font-size:13.5px;color:var(--faint)}
.mini .lab,.mini .n{display:block}
.k-unban.mini{--c:var(--gold)}
.bar{grid-template-columns:84px 1fr 26px}
.bar .track{height:3px;background:rgba(255,255,255,.06)}
.bar .track i{background:var(--gold)}
.lg{padding:15px 0;border-bottom-color:var(--line)}
.lgav .b{border-color:var(--s1)}
th{font-size:12.5px;font-weight:500;color:var(--faint);padding:12px 14px}
td{padding:15px 14px;border-bottom-color:var(--line)}
tr.click:hover td{background:rgba(217,182,110,.04)}
.pgrid,.stack{gap:18px}
.dossier{gap:30px}
.bust{border-radius:16px;border-color:var(--line)}
.pname{font-weight:300}
.sect{border-radius:18px;border-inline-start:1px solid var(--line);padding:24px 28px;position:relative}
.sect::before{content:"";position:absolute;inset-inline-start:0;top:24px;width:3px;height:22px;border-radius:2px;background:var(--c,var(--line2))}
.sect h4{font-weight:500;color:var(--mute);margin-bottom:16px}
.kv>div:nth-child(odd){color:var(--faint)}
.prog{height:3px}
.tile{background:none;border-radius:12px}
.tile:hover{background:rgba(217,182,110,.05)}
.srv .nm{font-weight:500;color:var(--mute);font-size:13.5px}
.modal{background:var(--s2);border-radius:20px}

/* ───── transitions.dev recipes (tokens + modal / toast / tabs / subtle number) ───── */
:root{--duration-quick:150ms;--duration-fast:250ms;--duration-medium:350ms;--ease-smooth-out:cubic-bezier(0.22,1,0.36,1);
  --modal-open-dur:250ms;--modal-close-dur:150ms;--modal-scale:.96;--modal-scale-close:.96;--modal-ease:var(--ease-smooth-out);
  --toast-open:350ms;--toast-close:250ms;--toast-distance:16px;--toast-blur:2px;--toast-scale:.97;--toast-ease:var(--ease-smooth-out);
