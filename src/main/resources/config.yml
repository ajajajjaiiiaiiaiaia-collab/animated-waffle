# ── أنيميشن الباند (/tempban) ───────────────────────────────────────────────
ban-animation:
  enabled: true
  beam-ticks: 30
  fall-ticks: 14
  title-ticks: 60
  hammer-height: 9.0
  hammer-scale: 4.0
  visible-to-all: false
  title: "<red><bold>BANNED"
  subtitle: "<gray>The hammer has spoken."
  actionbar: "<dark_gray>by <red><admin>"

# ===== طرد الشبكة =====
# المبند / البلاك ليست يتطرد من الشبكة كاملة (من البروكسي) بدل ما يرجع للهوب.
network:
  kick-from-proxy: true      # يرسل أمر الطرد للبروكسي (Velocity) عبر قناة BungeeCord
  fallback-kick-ticks: 10    # لو البروكسي ما نفذ، يتطرد من السيرفر بعد هالمدة

# ===== لوحة الويب (داخل البلقن) — الدخول عبر ديسكورد فقط =====
# شغّلها على سيرفر واحد فقط. الأفضل تحطها خلف Cloudflare/Nginx بـ HTTPS (وقتها secure-cookie: true).
#
# طريقة الإعداد:
#  1) https://discord.com/developers/applications  -> New Application (أو استخدم تطبيق البوت نفسه)
#  2) OAuth2 -> انسخ Client ID و Client Secret
#  3) OAuth2 -> Redirects -> أضف نفس redirect-uri بالضبط، مثال: https://panel.stark-mc.xyz/auth/callback
#  4) guild-id = آيدي سيرفر الديسكورد (Developer Mode -> كليك يمين على السيرفر -> Copy ID)
# يدخل فقط: صاحب السيرفر أو أي أحد معه صلاحية Administrator في ذاك السيرفر.
web:
  enabled: false
  port: 8085
  bind: "0.0.0.0"
  session-hours: 12
  trust-proxy: false         # true لو وراء بروكسي (يقرأ X-Forwarded-For)
  secure-cookie: false       # true لو الموقع على HTTPS
  proxy-players: true        # يجيب أونلاين الشبكة كاملة من Velocity (يحتاج لاعب واحد على الأقل على سيرفر اللوحة)
  protected-players: []      # أسماء ما تنعاقب من الموقع، مثال: [ahemd098]

  discord:
    client-id: ""
    client-secret: ""
    redirect-uri: "http://IP:8085/auth/callback"
    guild-id: ""
    recheck-minutes: 10      # كل كم دقيقة نتأكد إن الأدمن لسا Administrator (لو انسحبت منه الصلاحية تنقطع جلسته)

  # صلاحيات كل أدمن يدخل افتراضياً: view, ban, unban, blacklist, unblacklist, kick, mute, unmute, warn, unwarn, logs, control  (أو all)
  # control = قسم "التحكم" (فك الكل / تصفير الإنذارات). لو تبغاه لك بس، اكتب الصلاحيات بدونه بدل all.
  default-permissions: [all]

  # تخصيص صلاحيات أدمن معين (آيدي ديسكورد بين علامتي تنصيص!). مثال: مشرف يشوف ويكيك بس
  overrides: {}
  #  "123456789012345678":
  #    permissions: [view, kick]

  # آيديات ممنوعة من الدخول حتى لو أدمن (بين علامتي تنصيص)
  blocked-ids: []
