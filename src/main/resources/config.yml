  granted-message: "&a✔ Flight enabled — you're in the spawn world."
  revoked-message: "&c✖ Flight disabled — you left the spawn world."

country-flag:
  enabled: true
  api-timeout-ms: 3000

# علم الدولة كرأس لاعب قبل الاسم في التاب (بدون ريسورس باك، 1.21.9+ فقط).
# الأعلام من plugins/DuelPlugin/flags.yml
# mode: PAPER       → البلجن يضبط اسم التاب مباشرة (لازم TAB plugin ما يتحكم بأسماء التاب)
# mode: PLACEHOLDER → فقط %duel_flaghead% تحطه في إعدادات TAB plugin (يرجع <head_texture:HASH>)
tab-flag:
  enabled: true
  mode: PLACEHOLDER

# المتفرج الطائر
spectator:
  speed-item-slot: 8    # مكان ايتم سرعة الطيران في الهوتبار (1-8) — السلوت 0 للبوصلة

# ريست التوبات الأسبوعي (كل الستاتس تتصفر، والنسخة القديمة تنحفظ في جدول stats_history)
# يوم الجمعة 00:00 بتوقيت العراق. أول 2 في كل نوع توب عام ياخذون رتبة مؤقتة (LuckPerms) لمدة 3 أيام
weekly-reset:
  enabled: true
  timezone: "Asia/Baghdad"
  day: FRIDAY
  time: "00:00"
  reward:
    rank: "stark"
    duration: "3d"
    top-count: 2
    # الأنواع اللي تعطي رتبة: WINS / POINTS / STREAK / LOSSES (LOSSES مقفل افتراضياً)
    types: [WINS, POINTS, STREAK]

# الستاتس والتوبات
stats:
  # false = مباريات /duel (التحدي) و rematch ما تحسب على التوبات، فقط الكيو
  count-challenges: false

# ═══════════════════════════════════════════════════════════════════
# نظام التيرات التنافسي (لكل أرينا/kit بشكل مستقل) — مباريات الكيو فقط
# Rating مخفي (ELO) → عتبة التير التالي تفتح Rankup Challenge → الفوز = ترقية.
# لو التقييم نزل تحت عتبة تيرك بـ defense-buffer → Tier Defense (الخسارة = نزول تير).
# ═══════════════════════════════════════════════════════════════════
tier:
  enabled: true
  start-rating: 1000
  k-factor: 32
  placement-matches: 3          # أول مباريات بالموسم تستخدم placement-k عشان توصل لمستواك بسرعة
  placement-k: 40
  # اللاعب الجديد ما يظهر له تير (Unranked) لين يلعب هذا العدد من المباريات المحسوبة بالأرينا. 0 = يظهر LT5 من أول.
  unranked-until-games: 1
  unranked-label: "&7Unranked"
  rating-floor: 0
  challenge-rounds: 3           # مباراة Rankup Challenge = كم راوند
  challenge-cooldown-minutes: 30  # بعد خسارة التحدي، كم دقيقة قبل ما ينفتح له تحدي ثاني
  defense-buffer: 60            # كم نقطة تحت عتبة التير قبل ما يُطلب منه دفاع
  min-match-seconds: 10         # المباراة الأقصر من هذا ما تحسب (ما عدا مباريات الرواندات)
  broadcast-from: LT2           # الترقية لهذا التير وفوق تنعلن بالشات
  # الحد الأدنى للتقييم لفتح تحدي الوصول لكل تير
  thresholds:
    LT5: 0
    HT5: 1050
    LT4: 1100
    HT4: 1175
    LT3: 1250
    HT3: 1350
    LT2: 1450
    HT2: 1575
    LT1: 1700
    HT1: 1850
  matchmaking:
    base-range: 100               # ±Elo بالبداية
    expand-per-second: 10         # يتوسع كل ثانية انتظار
    max-range: 600
    any-opponent-after-seconds: 90  # بعدها أي خصم
    special-relax-after-seconds: 45 # شرط خصم التحدي/الدفاع (تير مناسب) يتخفف بعدها
  anti-abuse:
    pair-limit-per-hour: 3        # بعد كذا مباراة بنفس الساعة ضد نفس اللاعب ما تغيّر التقييم
    same-ip-unrated: true         # نفس الاتصال (IP) = ما تحسب
  # أيقونة الكيت بالتاب قبل التير: %duel_tier_icon% (1.21.9+ بدون ريسورس باك)
  tab-icon:
    enabled: true
    color: "&7"                   # لون التير بالتاب (رمادي كامل). فاضي = لون كل تير
    atlas: "minecraft:items"      # 1.21.11 = items  (1.21.9-1.21.10 = blocks)
    overrides: {}                 # arena: "minecraft:item/netherite_sword"  أو  "atlas|sprite"
  season:
    auto-end-days: 0              # 0 = يدوي فقط (/tier admin season end)
    soft-reset-keep: 0.5          # كم % من فرق التقييم عن البداية يبقى بعد نهاية الموسم
