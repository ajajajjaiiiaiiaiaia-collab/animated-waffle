settings:
  duel-item-slot: 4
  countdown-seconds: 5
  winner-delay-seconds: 5
  loser-spectator-seconds: 5
  party-drop-loot: true
  arena-copy-prefix: "duel_arena_"
  hide-join-quit-messages: true

# رسبن البارتي (FFA) — الماب الدائري
# البوردر في ماين كرافت مربع، فأي ماب دائري لازم تضيفه هنا باسم الـ world (نفس اسم الماب في الأرينا).
# x / z / radius اختيارية: لو تركتها فاضية = مركز البوردر ونصف حجمه.
party-respawn:
  # أقصى فرق في الارتفاع عن نقاط 1v1 (0 = نفس Y بالضبط)
  vertical-range: 0
  # عوالم (ماب) فيها زجاج حوالين الأرينا: لاعبين الـ FFA يرسبنون داخل الزجاج فقط (يطبق على كل أنواع الزجاج)
  # صيغة "Arena:world" = الماب في أرينا معينة فقط، أو "world" لحاله = في كل الأرينات
  glass-worlds:
    - "mapp5"   # ماب End في كل الأرينات
  circles: {}
  # مثال:
  # circles:
  #   MyCircleMap:
  #     x: 0.5
  #     z: 0.5
  #     radius: 40

# حارس البوردر: يمنع لاعب المباراة يقرّب من حافة البوردر أقل من min-distance بلوك
border-guard:
  enabled: true
  min-distance: 1.0

# بارير بدل البوردر: جدار بلوكات بارير مخفية على حافة البوردر، والبوردر الحقيقي يتكبّر عشان ما يبان
barrier-border:
  enabled: true
  height-below: 15      # من ارتفاع الـ spawn لتحت
  keep-terrain: true    # البارير ينحط بس مكان الهواء/الماء — ما يحفر الأرض ولا يخرّب شكلها
  height-above: 60      # من ارتفاع الـ spawn لفوق
  auto-build: true      # تلقائي: بعد أول ماتش على الماب يبني البارير في القالب ويشيل بوردره (بدون /duelbarrier)
  auto-build-after-matches: 1   # كم ماتش لازم يصير على الماب قبل التحويل

# الرواندات
rounds:
  break-seconds: 8                   # مدة الاستراحة = مدة المشهد السينمائي (ارتفاع → مواجهة → سحب). أقل من 6 ثواني يضغط المشهد
  new-world-per-round: true
  same-world: true                   # دائماً نفس العالم بين الرواندات: البلوكات (مكسورة/مبنية/ماء/انفجار/نار) ترجع واللاعبين ينسحبون لنقاط السبون. false = عالم جديد لكل راوند
  cinematic:
    rise-height: 10                  # ارتفاع القمة فوق السبون (بلوك) — ينقص تلقائياً لو فيه سقف
    gap: 3.0                         # المسافة بين اللاعبين وهم يتواجهون فوق
    dynamic: true                    # يضبط المشهد حسب حجم الأرينا: يمدّد الوقت لو المسار طويل، ويقصّر الارتفاع لو ما كفى
    max-extra-seconds: 6             # أقصى تمديد فوق break-seconds للأرينات الكبيرة
  pull-max-speed: 0.8                # أقصى سرعة سحب (بلوك/tick)

# تحميل شنكات الأرينا async قبل الـ teleport (يقلل اللاق وقت بداية الماتش/الراوند)
chunk-preload:
  enabled: true
  radius: 4            # شنك حول كل spawn
  max-chunks: 400      # سقف الشنكات لكل عالم (الـ FFA يحمّل كل البوردر لو أقل من هذا الرقم)
  timeout-ticks: 100   # لو التحميل تأخر نكمّل بدونه
  hold-ticks: 100      # كم نثبّت الشنكات بعد الـ teleport

world-pool:
  enabled: false
  size: 10
  fill-interval-seconds: 5
  startup-delay-seconds: 10
  delete-on-shutdown: true

messages:
  prefix: "&8[&bDuel&8] &r"
  winner-title: "&aVICTORY"
  winner-subtitle: "&7You dominated the arena!"
  loser-title: "&a☠ &cDEFEAT"
  loser-subtitle: "&7Better luck next time!"
  countdown-title: "&e{seconds}"
  go-title: "&aGO!"
  go-subtitle: "&7Fight!"

sounds:
  countdown: BLOCK_NOTE_BLOCK_PLING
  go: ENTITY_ENDER_DRAGON_GROWL
  winner: UI_TOAST_CHALLENGE_COMPLETE
  loser: ENTITY_WITHER_DEATH
  queue-join: ENTITY_EXPERIENCE_ORB_PICKUP
  queue-found: BLOCK_BELL_USE

