# Push applied to a player whose shield gets disabled by an axe hit.
enabled: true

# Only axes disable shields in vanilla. Set false to push on ANY hit that puts the shield on cooldown.
require-axe: true

push:
  # Horizontal strength (blocks/tick). Vanilla knockback is about 0.4.
  horizontal: 0.9
  # Upward velocity added to the push.
  vertical: 0.35
  # Keep the victim's current velocity and add to it (false = replace it).
  additive: false

# Minimum ticks between two pushes on the same player.
internal-cooldown-ticks: 10

# Worlds where the push is disabled.
disabled-worlds: []

effects:
  sound: true
  particles: true

messages:
  reloaded: "&aShieldPush config reloaded."
