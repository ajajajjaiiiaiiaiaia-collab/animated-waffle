# AntiTrigger 1.4 - triggerbot + off-crosshair detection, evidence files and optional AI review before a punishment.
#
# A triggerbot attacks the instant the crosshair touches an enemy, WITHOUT the player moving the mouse,
# and (unlike a human) almost never swings at nothing. A window of hits is flagged only when all the
# signals below agree. By default nobody is punished automatically: staff get an alert and a log line.
#
# If you update from 1.0, delete the old config.yml so this one is generated.

detection:
  range: 4.0              # blocks; how far the look-ray is traced
  ray-size: 0.1           # hitbox expansion for the look-ray
  window-size: 12         # how many recent hits are kept per player
  min-samples: 10         # hits needed before a window is judged
  window-seconds: 40      # hits older than this are dropped
  instant-ticks: 2        # "instant" = attack within this many ticks of the crosshair touching the enemy (1 tick = 50ms)
  min-instant-ratio: 0.8  # share of hits in the window that must be instant
  max-air-swings: 1       # swings at nothing allowed inside the window (humans swing a lot)
  # Third signal: the hit happened while the player was NOT moving the mouse (the enemy walked into the crosshair).
  require-passive: true   # false = judge only on the first two signals (more sensitive, more false positives)
  passive-ms: 100         # no mouse movement for at least this long before the hit counts as "passive"
  min-passive-ratio: 0.5  # share of hits in the window that must be passive

safety:
  max-ping: 150           # players above this are never judged
  min-tps: 18.0           # nobody is judged while the server lags
  bedrock-prefix: "."     # Floodgate/Geyser names start with this; touch input is exempt ("" to disable)
  bypass-permission: antitrigger.bypass

violations:
  alert-vl: 2.0           # staff alert once a player has this many violation levels (VL)
  reset-after-seconds: 300  # VL goes back to 0 after this many seconds without a new flag (0 = never)
  decay-per-minute: 0.0   # optional slow decay on top of the reset (0 = off)

punish:
  enabled: false          # false = alerts and logs only, nobody is punished automatically
  # Each action runs ONCE when a player's VL reaches its "vl" (and again after the VL has been reset).
  # Placeholders: %player%  %vl%   Commands run as console, without the leading slash.
  # Note: "tempban" is not a vanilla command; it needs EssentialsX, LiteBans, or your StarkModeration.
  actions:
    - vl: 3.0
      commands:
        - "tempban %player% 1d Triggerbot"

# Second check: attacks where the crosshair was AWAY from the victim (killaura / aim assist / hitbox expand).
# EVERY attack counts, normal hits and off-crosshair hits together, so mixing in normal hits does not hide it.
# A wide ray plus a short grace period absorb lag, so only clearly-off attacks count as "off".
offtarget:
  enabled: true
  window-size: 6          # last N attacks kept per player
  min-hits: 4             # attacks needed before the window is judged
  min-ratio: 0.6          # share of those attacks that must be off-crosshair (0.6 = 60%)
  window-seconds: 20      # attacks older than this are dropped
  ray-size: 0.5           # extra-wide hitbox used to decide "off"; bigger = fewer false flags
  grace-ticks: 3          # the crosshair counts as on-target if it touched the victim this recently (1 tick = 50ms)
  vl: 1.0                 # VL added per flag; the punish ladder above applies

# Evidence: the last few seconds of every player are kept in memory (per tick: rotation, rotation speed, target,
# distance, angle error between the crosshair and the target; per attack: distance, angle error, mouse-still ms, CPS ...).
# When a flag alerts staff, it is saved as plugins/AntiTrigger/evidence/<player>_<time>_<type>.json.
evidence:
  enabled: true
  seconds: 6              # 2 to 10: how long the per-tick frames are kept
  attack-seconds: 30      # how far back the attack list goes (older attacks belong to other fights)
  save-on-alert: true
  folder: evidence
  keep-files: 300         # oldest files are deleted beyond this

# AI review: before a punish action runs, the evidence is sent to an AI API (Claude or Gemini) for a second opinion.
# The action only runs if the AI says "cheating" with at least min-confidence. Otherwise staff get the AI's reasons.
# Needs an API key: put it here or in the ANTHROPIC_API_KEY / GEMINI_API_KEY environment variable. Keep this file private.
# Test it without punishing anyone:  /antitrigger review <player>
review:
  enabled: false
  # confirm = the AI only double-checks before a punish action (VL ladder above).
  # primary = the AI ALSO screens suspicious fights on its own and can punish without any VL (settings below).
  mode: primary
  provider: gemini        # gemini or anthropic
  api-key: ""
  model: ""               # empty = default for the provider (gemini-3.6-flash / claude-sonnet-5-5)
  min-confidence: 0.85
  timeout-seconds: 12
  cooldown-seconds: 20    # minimum time between two reviews of the same player
  on-failure: alert       # alert = no punishment if the AI cannot be reached, punish = run the action anyway
  primary:
    cooldown-seconds: 30        # minimum time between two screenings of the same player
    confirmations: 1            # the AI must say "cheating" this many times (within confirm-window-seconds) before the ban
    confirm-window-seconds: 180
    commands:
      - "tempban %player% 1d Hacks (AI)"
    # A fight is only sent to the AI if ONE of these loose gates trips (so normal fights cost nothing):
    gate:
      off-crosshair-ratio: 0.4  # share of attacks away from the crosshair
      snap-attacks: 2           # attacks right after a fast rotation that ended exactly on the target
      cps: 18                   # clicks per second
      reach: 3.6                # blocks
      instant-ratio: 0.6        # share of instant hits (together with a still mouse)

packetevents:
  enabled: true           # use PacketEvents (if installed) for millisecond-accurate mouse-movement timing

messages:
  prefix: "&c[AntiTrigger] "
  alert: "&f%player% &7flagged &8| &7instant &f%ratio%% &8| &7passive &f%passive%% &8| &7air swings &f%air% &8| &7hits &f%samples% &8| &7VL &f%vl% &8| &7ping &f%ping%ms"
  offtarget-alert: "&f%player% &7hits off crosshair &8| &7off-target &f%ratio%% &8| &7attacks &f%samples% &8| &7VL &f%vl% &8| &7ping &f%ping%ms"
