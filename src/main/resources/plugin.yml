name: SPortal
version: 1.0.0
main: com.stark.sportal.SPortalPlugin
api-version: 1.21
author: Stark

commands:
  s:
    description: SPortal main command
    usage: /s portal <subcommand>
    permission: sportal.use
    permission-message: You do not have permission to use this command.

permissions:
  sportal.use:
    default: op
  sportal.admin:
    default: op
