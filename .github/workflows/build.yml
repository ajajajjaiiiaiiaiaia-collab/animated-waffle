name: Build PearlCatch

on:
  push:
    branches: [pearlcatch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pearlcatch-latest --cleanup-tag --yes || true
          gh release create pearlcatch-latest target/PearlCatch.jar \
            --title "PearlCatch latest build" \
            --notes "Automatic build from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
