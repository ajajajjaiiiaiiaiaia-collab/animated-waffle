name: Build Grim

on:
  push:
    branches: [grim-bedrock-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Bukkit jar
        run: ./gradlew :bukkit:shadowJar --no-daemon
      - name: Pick jar
        run: |
          JAR=$(ls bukkit/build/libs/*.jar | grep -v -E 'sources|javadoc|plain' | head -n1)
          echo "Built: $JAR"
          cp "$JAR" Grim-BedrockTest.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete grim-bedrock-test --cleanup-tag --yes || true
          gh release create grim-bedrock-test Grim-BedrockTest.jar \
            --title "Grim 2.3.75 TEST: setback packet injection reverted" \
            --notes "Grim 2.3.75-8ec9b7d test build for Bedrock kicks (issue 3007): reverts upstream 0ea9b5a, keeps spear/end crystal exemption. Commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
