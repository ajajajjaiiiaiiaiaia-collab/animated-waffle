name: Build AntiTrigger

on:
  push:
    branches: [antitrigger]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        run: mvn -B -q package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete antitrigger-latest --cleanup-tag --yes || true
          gh release create antitrigger-latest target/AntiTrigger-*.jar \
            --title "AntiTrigger 1.2.0 latest build" \
            --notes "Automatic build from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
