name: Build LimboAuth Dialog
on:
  push:
    branches: [limboauth-dialog]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l build/libs
          JAR=$(ls build/libs/*.jar | grep -v -i "javadoc\|sources\|plain" | head -1)
          unzip -l "$JAR" | grep -q "velocity-plugin.json" || { echo "missing velocity-plugin.json in $JAR"; exit 1; }
          cp "$JAR" LimboAuth.jar
          gh release delete limboauth-dialog-latest --cleanup-tag -y || true
          gh release create limboauth-dialog-latest LimboAuth.jar --title "LimboAuth Dialog" --notes "Dialog GUI for 1.21.6+"
